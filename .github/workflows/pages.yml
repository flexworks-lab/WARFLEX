name: GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write update manifest
        env:
          UPDATE_MESSAGE: ${{ github.event.head_commit.message || 'WARFLEX updated' }}
        run: |
          node -e 'const fs=require("fs"); const info={version:process.env.GITHUB_SHA,message:process.env.UPDATE_MESSAGE,timestamp:new Date().toISOString()}; fs.writeFileSync("update.json", JSON.stringify(info));'

      - name: Stamp and validate client bundle
        run: |
          sed -i "s/__WARFLEX_BUILD__/${GITHUB_SHA}/g" index.html
          node --check src/main.js
          node --check src/physics/PhysicsWorld.js
          node --check src/physics/RagdollController.js
          node --check src/systems/WaveDirector.js
          node --check src/systems/SteeringAgent.js
          node --check src/assets/AssetManager.js
          node --check src/world/MapLoader.js
          node --check src/world/PropInstancer.js
          node --check src/world/BakedLighting.js
          node --check src/world/Atmosphere.js
          node --check src/world/GraphicsFX.js
          node --check src/ai/NavMeshService.js
          node --check src/ai/NavMeshAgent.js
          grep -q '"cannon-es":' index.html
          grep -q '"three-pathfinding":' index.html
          grep -q '"three/addons/":' index.html
          grep -q "./src/main.js?v=${GITHUB_SHA}" index.html
          test -s src/main.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          rm -rf _site
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5


  retry-deploy:
    name: Retry GitHub Pages deploy
    if: ${{ always() && needs.deploy.result == 'failure' }}
    needs: deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.retry_deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Retry Pages deployment
        id: retry_deployment
        uses: actions/deploy-pages@v5
